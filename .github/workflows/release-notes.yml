name: Create release notes

on:
  push:
    tags:
      - "web-v*"
      - "ios-v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release notes
    runs-on: ubuntu-latest
    steps:
      - name: Create generated release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "")
            const prefix = tag.startsWith("web-v") ? "Web" : "iOS"
            const ancestry = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: context.sha,
              head: "main",
            })
            if (!["ahead", "identical"].includes(ancestry.data.status)) {
              core.setFailed(`Release tag ${tag} is not contained in main (${ancestry.data.status})`)
              return
            }
            const migrationFiles = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "apps/web/src/db/migrations",
              ref: context.sha,
            })
            const currentMigration = migrationFiles.data
              .filter((file) => file.type === "file" && /^\d+_.*\.sql$/.test(file.name))
              .map((file) => file.name.match(/^(\d+)_/)?.[1])
              .filter(Boolean)
              .sort((a, b) => Number(a) - Number(b))
              .at(-1) ?? "none"
            const generated = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
            })
            const metadata = [
              "## Release metadata",
              `- Git SHA: \`${context.sha}\``,
              `- Image SHA: \`${context.sha}\``,
              `- Current database migration: \`${currentMigration}\``,
              "- App Store release: manual",
              "",
            ].join("\n")
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `${prefix} ${tag}`,
              body: metadata + generated.data.body,
              draft: false,
              prerelease: tag.includes("-") && !/^web-v\d+\.\d+\.\d+$/.test(tag) && !/^ios-v\d+\.\d+\.\d+$/.test(tag),
            })
