name: Database integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinan-staging-database-integration
  cancel-in-progress: false

jobs:
  concurrency-tests:
    name: Neon staging concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.NEON_STAGING_DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Require staging database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configure NEON_STAGING_DATABASE_URL before running this workflow."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate migrations
        run: npm run db:check --workspace=@sinan/web

      - name: Apply migrations
        run: npm run db:migrate --workspace=@sinan/web

      - name: Verify migration idempotency
        run: npm run db:migrate --workspace=@sinan/web

      - name: Run database concurrency tests
        run: npm run test:integration --workspace=@sinan/web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real release API flow
        env:
          INVITE_REQUIRED: "true"
        run: npm run test:e2e:release --workspace=@sinan/web
