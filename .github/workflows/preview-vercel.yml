name: Deploy Web Preview to Vercel

on:
  push:
    branches:
      - codex/release-20260815
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/preview-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sinan-vercel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy isolated staging preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Verify deployment credentials
        run: |
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_TOKEN"

      - name: Deploy Preview
        id: deploy
        run: |
          preview_url=$(npx --yes vercel@latest deploy \
            --yes \
            --token "$VERCEL_TOKEN")
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "### Vercel Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect deployment
        run: |
          npx --yes vercel@latest inspect \
            "${{ steps.deploy.outputs.url }}" \
            --token "$VERCEL_TOKEN" \
            --wait

      - name: Verify live and ready health checks
        run: |
          live_response=$(timeout 45s npx --yes vercel@latest curl /api/health/live \
            --deployment "${{ steps.deploy.outputs.url }}")
          printf '%s' "$live_response" | jq '{status, service}'
          printf '%s' "$live_response" | jq -e '.status == "ok"'

          ready_response=$(timeout 45s npx --yes vercel@latest curl /api/health/ready \
            --deployment "${{ steps.deploy.outputs.url }}")
          printf '%s' "$ready_response" | jq '{status, configuration, database}'
          printf '%s' "$ready_response" | jq -e \
            '.status == "ready" and .configuration == "valid" and .database == "reachable"'
