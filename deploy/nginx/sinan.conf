limit_req_zone $binary_remote_addr zone=sinan_api:10m rate=20r/s;

upstream sinan_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name sinanapp.cn www.sinanapp.cn;
    return 301 https://sinanapp.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sinanapp.cn;

    ssl_certificate /etc/letsencrypt/live/sinanapp.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sinanapp.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 2m;

    location /api/ {
        limit_req zone=sinan_api burst=40 nodelay;
        proxy_pass http://sinan_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://sinan_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

